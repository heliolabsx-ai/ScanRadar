services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scanner
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data

  ingest:
    build: ./ingest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  engine:
    build: ./engine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scans:/app/scans:ro
    depends_on:
      - ingest

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scans:/app/scans:ro
      - ./scripts:/app/scripts:ro
      - ./docs/superpowers/notes:/app/notes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
      - postgres

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
