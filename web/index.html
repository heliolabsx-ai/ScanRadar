<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScanRadar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: control strip → sector/breadth rail → bull/bear card grid → detail panel with canvas chart. Terminal-style data UI. */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --fg:#1b1f1c; --muted:#6b7570; --line:#dfe3df;
  --bull:#1e8a4c; --bull-soft:#e3f3e9; --bear:#c4383a; --bear-soft:#f9e5e5;
  --amber:#b9790f; --accent:#2b4a8c; --vwap:#4f6fd6;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --panel:#191e1b; --fg:#e6ebe7; --muted:#8b968f; --line:#2a312d;
  --bull:#4cc47f; --bull-soft:#15301f; --bear:#f06a6c; --bear-soft:#3a1a1b;
  --amber:#e0a63a; --accent:#8aa6e8; --vwap:#8fa6ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --panel:#191e1b; --fg:#e6ebe7; --muted:#8b968f; --line:#2a312d;
  --bull:#4cc47f; --bull-soft:#15301f; --bear:#f06a6c; --bear-soft:#3a1a1b;
  --amber:#e0a63a; --accent:#8aa6e8; --vwap:#8fa6ea; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font:600 16px/1.2 var(--sans);margin:0;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.top .clock{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.st{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);padding:2px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:6px}
.st .dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.st.live{color:var(--bull);border-color:var(--bull)}.st.live .dot{background:var(--bull);animation:pulse 1.4s ease-in-out infinite}
.st.replay{color:var(--accent);border-color:var(--accent)}.st.replay .dot{background:var(--accent)}
.st.warn{color:var(--amber);border-color:var(--amber)}.st.warn .dot{background:var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{font:500 12px var(--sans);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=number],select{font:500 12px var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
input[type=number]{width:84px}
.grid{display:grid;grid-template-columns:230px 1fr 1fr 360px;gap:12px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:200px 1fr 1fr}.detail{grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:1fr}.detail{grid-column:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.breadth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.breadth b{font:700 22px var(--mono)}
.sector{display:grid;grid-template-columns:72px 1fr 54px;gap:6px;align-items:center;font-size:11.5px;padding:3px 0}
.sector .bar{height:6px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.sector .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.sector .v{text-align:right}
.up{color:var(--bull)}.dn{color:var(--bear)}.mut{color:var(--muted)}
.col h2{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.card:hover{border-color:var(--fg)}
.card.sel{outline:2px solid var(--accent)}
.card.bull{border-left-color:var(--bull)}.card.bear{border-left-color:var(--bear)}
.card .sym{font:700 13px var(--mono)}
.card .pct{font:600 13px var(--mono);text-align:right}
.card .sub{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .rank{font:500 11px var(--mono);color:var(--muted);text-align:right}
.card .stab{grid-column:1/-1;font:500 10.5px var(--mono);color:var(--muted)}
.chip{font:600 10px var(--mono);letter-spacing:.04em;padding:1px 6px;border-radius:3px}
.chip.lb{background:var(--bull-soft);color:var(--bull)}.chip.sb{background:var(--bear-soft);color:var(--bear)}
.chip.lu,.chip.sc,.chip.nt{background:var(--line);color:var(--muted)}
.chip.pick{background:var(--fg);color:var(--bg)}
.detail .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.detail .big{font:700 26px var(--mono)}
.detail .px{font:500 14px var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;font-size:11.5px;margin-top:8px}
.kv dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px;align-self:center}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;max-width:100%;margin-top:10px;border-radius:4px}
.conv{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.conv i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.conv i.on{background:currentColor}
.rule{margin-top:10px;font-size:11.5px;padding:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.rule b{font-family:var(--mono)}
.size{margin-top:8px;font-size:11.5px;padding:8px;border-radius:4px;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.size dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px}.size dd{margin:0;font-family:var(--mono)}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:-2px 0 12px;position:relative}
.slider input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.slider .t{font-size:11px;color:var(--muted)}
.slider .ticks{grid-column:2;position:relative;height:12px;font:10px var(--mono);color:var(--muted)}
.slider .ticks span{position:absolute;transform:translateX(-50%)}
.tfrow{display:flex;gap:4px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tfrow .tf{padding:2px 7px;font:600 10.5px var(--mono)}.tfrow .tf.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.readout{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.alerts{margin-top:12px}.alert{display:grid;grid-template-columns:40px 1fr auto;gap:6px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.empty{color:var(--muted);font-size:12px;padding:20px 4px;line-height:1.6}
.empty code{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="top">
  <h1>ScanRadar</h1>
  <select id="day" title="Session"></select>
  <span class="clock mono" id="clock">--:--</span>
  <span class="st" id="status"><i class="dot"></i><span id="statusText">WAITING</span></span>
  <button id="live" class="primary" hidden title="Return to the live feed">● Live</button>
  <label>Risk ₹ <input id="risk" type="number" min="100" step="100" value="2000" title="Rupees risked per trade; sizes the quantity in the detail panel"></label>
  <button id="theme" title="Toggle light / dark">◐</button>
</div>
<div class="slider">
  <span class="t mono">09:15</span>
  <input type="range" id="at" min="0" max="375" step="1" value="375" title="As-of time: drag to replay the day minute by minute (←/→ one minute, Shift for five)">
  <span class="t mono">15:30</span>
  <div class="ticks" id="ticks"></div>
</div>
<div class="grid">
  <div class="panel rail">
    <p class="eyebrow">Breadth &amp; sectors</p>
    <div class="breadth"><span>▲ Bullish <b class="up" id="nbull">0</b></span><span>▼ Bearish <b class="dn" id="nbear">0</b></span></div>
    <div id="sectors"></div>
    <div class="alerts"><p class="eyebrow">Rule alerts</p><div id="alerts"><span class="mut">none yet</span></div></div>
  </div>
  <div class="panel col"><h2><span class="up">Bulls</span><span class="mono" id="bullhdr"></span></h2><div id="bulls"></div></div>
  <div class="panel col"><h2><span class="dn">Bears</span><span class="mono" id="bearhdr"></span></h2><div id="bears"></div></div>
  <div class="panel detail" id="detail"><p class="eyebrow">Select a stock</p><div class="empty" id="detailEmpty">Waiting for the first ranking. Cards appear from 09:15 on a trading day.</div></div>
</div>
<script>
// ---------- state ----------
const S = {mode:'live', day:null, at:null, snap:null, selected:null, tf:'1m', days:[], live:false, lots:{}, sectorsOf:{}, risk:2000, alerts:[]};
const $ = id => document.getElementById(id);
const fmt = (n, d=2) => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg = (n, d=2) => (n==null||isNaN(n)) ? '—' : (n>=0?'+':'')+fmt(n,d);
const inr = n => (n==null||isNaN(n)) ? '—' : '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const api = p => fetch(p).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status+' '+p)));

// ---------- theme ----------
try{ const t = localStorage.getItem('theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('theme', next); }catch(e){}
  renderDetail();
};
try{ const r = +localStorage.getItem('risk'); if(r>0){ S.risk = r; $('risk').value = r; } }catch(e){}
$('risk').onchange = () => { S.risk = Math.max(100, +$('risk').value || 2000); $('risk').value = S.risk; try{ localStorage.setItem('risk', S.risk); }catch(e){} renderDetail(); };

// ---------- status ----------
function setStatus(text, cls){ $('statusText').textContent = text; $('status').className = 'st ' + (cls||''); }

// ---------- rendering ----------
function stab(a){
  if(a.top3_since === undefined && a.rank_30m_ago === undefined) return '';
  const parts = [];
  if(a.picked) parts.push(a.top3_since ? `top 3 since ${a.top3_since}` : 'top 3 …');
  if(a.rank_30m_ago != null){ const d = a.rank_30m_ago - a.rank; parts.push(`#${a.rank} ${d>0?'↑':d<0?'↓':'→'} from #${a.rank_30m_ago} (30m)`); }
  else parts.push(`#${a.rank} · 30m ago …`);
  return `<span class="stab">${parts.join(' · ')}</span>`;
}
function card(a, side){
  return `<div class="card ${side} ${S.selected===a.symbol?'sel':''}" data-sym="${a.symbol}">
    <span class="sym">${a.symbol} ${a.picked?'<span class="chip pick">PICK</span>':''}</span><span class="pct ${side==='bull'?'up':'dn'}">${sg(a.pct)}%</span>
    <span class="sub"><span class="chip ${a.oi_cls}">${a.oi_label}</span><span>OI ${sg(a.oi_pct,1)}%</span><span>${a.above_vwap?'▲':'▼'} VWAP</span><span>RVOL ${fmt(a.rvol,1)}×</span></span>
    <span class="rank">#${a.rank} · p${fmt(a.pctile,0)}</span>${stab(a)}</div>`;
}
function renderCards(){
  const s = S.snap; if(!s) return;
  $('nbull').textContent = s.n_bull; $('nbear').textContent = s.n_bear;
  const mx = Math.max(...Object.values(s.sectors).map(Math.abs), 0.1);
  $('sectors').innerHTML = Object.entries(s.sectors).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const w = Math.abs(v)/mx*50, l = v>=0?50:50-w;
    return `<div class="sector"><span>${k}</span><span class="bar"><i style="left:${l}%;width:${w}%;background:var(--${v>=0?'bull':'bear'})"></i></span><span class="v mono ${v>=0?'up':'dn'}">${sg(v)}%</span></div>`}).join('');
  $('bulls').innerHTML = s.bulls.slice(0,15).map(a=>card(a,'bull')).join('');
  $('bears').innerHTML = s.bears.slice(0,15).map(a=>card(a,'bear')).join('');
  $('bullhdr').textContent = `${s.n_bull} · top ${Math.min(3,s.n_bull)} picked`;
  $('bearhdr').textContent = `${s.n_bear} · top ${Math.min(3,s.n_bear)} picked`;
}
function rowFor(sym){ const s=S.snap; return s ? [...s.bulls, ...s.bears].find(x=>x.symbol===sym) : null; }
function sizing(a){
  const lot = S.lots[a.symbol] || 0, dist = Math.abs(a.price - a.stop);
  if(!lot || !dist) return `<dt>Size</dt><dd class="mut">lot size unknown</dd>`;
  const qty = Math.floor(S.risk / dist / lot) * lot;
  if(!qty) return `<dt>Size</dt><dd class="mut">lot of ${lot} too large for ₹${fmt(S.risk,0)} risk (₹${fmt(dist*lot,0)}/lot)</dd>`;
  return `<dt>Qty</dt><dd>${qty.toLocaleString('en-IN')} <span class="mut">(${qty/lot} × ${lot})</span></dd>
          <dt>Risk</dt><dd class="dn">${inr(qty*dist)}</dd><dt>Reward</dt><dd class="up">${inr(qty*Math.abs(a.target-a.price))}</dd>`;
}
// ---------- detail panel + chart ----------
const TFS = ['1m','3m','5m','15m','30m','60m','1D'];
const TFMIN = {'1m':1,'3m':3,'5m':5,'15m':15,'30m':30,'60m':60};
try{ const t = localStorage.getItem('tf'); if(TFS.includes(t)) S.tf = t; }catch(e){}
const chartCache = {key:null, data:null, ref:null, delta:false};
const dailyCache = {sym:null, bars:null};
let hoverIdx = null;
const minIdx = c => hhmmToMin(c.ts.slice(11,16));
const K = n => n==null ? '—' : Math.abs(n)>=1e7 ? (n/1e7).toFixed(2)+'Cr' : Math.abs(n)>=1e5 ? (n/1e5).toFixed(1)+'L' : Math.abs(n)>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n);

function cutAt(cands, at){
  const lim = hhmmToMin(at);
  const done = cands.filter(c => minIdx(c) < lim);
  const atBar = cands.find(c => minIdx(c) === lim);
  if(!atBar) return done;
  const prevOi = done.length ? done[done.length-1].oi : atBar.oi;
  return [...done, {ts: atBar.ts, o: atBar.o, h: atBar.o, l: atBar.o, c: atBar.o, v: 0, oi: prevOi, d: 0, stub: true}];
}
function resampleBrowser(cands, tfm){
  const out = []; let cur = null;
  for(const c of cands){
    const i = minIdx(c), w = Math.floor(i/tfm);
    if(!cur || cur.w !== w){ cur = {w, i0: w*tfm, o:c.o, h:c.h, l:c.l, c:c.c, v:c.v, oi:c.oi, n:1, stub:!!c.stub}; out.push(cur); }
    else { cur.h = Math.max(cur.h, c.h); cur.l = Math.min(cur.l, c.l); cur.c = c.c; cur.v += c.v; cur.oi = c.oi; cur.n++; cur.stub = !!c.stub; }
  }
  return out;
}
function vwapSeries(cands){ let pv=0, vv=0; return cands.map(c => { pv += (c.h+c.l+c.c)/3*c.v; vv += c.v; return {i: minIdx(c), v: vv ? pv/vv : c.c}; }); }

async function renderDetail(){
  const a = rowFor(S.selected); const d = $('detail');
  if(!a){ if(S.snap) d.innerHTML = `<p class="eyebrow">Select a stock</p><div class="empty">${S.selected||'This symbol'} is not in the current ranking.</div>`; return; }
  const side = a.dir>0?'bull':'bear', sec = S.snap.sectors[a.sector], lst = side==='bull'?S.snap.bulls:S.snap.bears;
  const bIdx = lst.findIndex(x=>x.symbol===a.symbol);
  d.innerHTML = `<p class="eyebrow">${a.sector} ${sec!=null?`<span class="${sec>=0?'up':'dn'}">${sg(sec)}%</span> · vs sector <span class="${a.pct-sec>=0?'up':'dn'}">${sg(a.pct-sec)}%</span>`:''} · rank #${a.rank}/${S.snap.n_bull+S.snap.n_bear} · p${fmt(a.pctile,1)}</p>
   <div class="head"><div><div class="mono" style="font-weight:700;font-size:15px">${a.symbol}</div><div class="px">₹${fmt(a.price)} <span class="${side==='bull'?'up':'dn'}">${sg(a.chg)}</span></div></div>
   <div class="big ${side==='bull'?'up':'dn'}">${sg(a.pct)}%</div></div>
   <div style="margin-top:6px"><span class="chip ${side==='bull'?'lb':'sb'}">${side.toUpperCase()}</span> <span class="mono" style="font-weight:700">${a.conv}</span><span class="conv ${side==='bull'?'up':'dn'}">${[1,2,3,4,5].map(i=>`<i class="${a.conv>=i*20-10?'on':''}"></i>`).join('')}</span> &nbsp;<span class="chip ${a.oi_cls}">${a.oi_label}</span></div>
   <dl class="kv">
    <dt>OI Δ</dt><dd>${sg(a.oi_pct,1)}%</dd><dt>Vol Δ</dt><dd>${S.snap.delta_available===false?'<span class="mut">—</span>':(a.delta/1000).toFixed(1)+'K'}</dd>
    <dt>VWAP</dt><dd>${fmt(a.vwap)} ${a.above_vwap?'▲':'▼'}</dd><dt>RVOL</dt><dd>${fmt(a.rvol)}×</dd>
    <dt>OR H/L</dt><dd>${fmt(a.orH)} / ${fmt(a.orL)}</dd><dt>OB</dt><dd>${a.ob?fmt(a.ob.lo)+'–'+fmt(a.ob.hi):'—'}</dd>
    <dt>S1 / S2</dt><dd>${fmt(a.S1)} / ${fmt(a.S2)}</dd><dt>R1 / R2</dt><dd>${fmt(a.R1)} / ${fmt(a.R2)}</dd>
    <dt>Stop</dt><dd>${fmt(a.stop)}</dd><dt>Target</dt><dd>${fmt(a.target)}</dd>
    <dt>Risk</dt><dd>${fmt(a.risk_pct)}%</dd><dt>R:R</dt><dd>1:${fmt(a.rr,1)}</dd>
   </dl>
   <dl class="size">${sizing(a)}</dl>
   <div class="tfrow">${TFS.map(t=>`<button class="tf ${S.tf===t?'on':''}" data-tf="${t}">${t}</button>`).join('')}<span class="readout mono" id="readout"></span></div>
   <canvas id="chart" width="620" height="430"></canvas>
   <div class="rule">RULE · ${a.picked?`<b>PICKED</b> — #${bIdx+1} among ${side}s (top 3 taken).`:`<b>NOT PICKED</b> — #${bIdx+1} among ${side}s.`} ${a.rr<1.5?'R:R below 1.5 vetoes a pick.':''}</div>`;
  d.querySelectorAll('.tf').forEach(b => b.onclick = () => { S.tf = b.dataset.tf; try{ localStorage.setItem('tf', S.tf); }catch(e){} d.querySelectorAll('.tf').forEach(x=>x.classList.toggle('on', x.dataset.tf===S.tf)); hoverIdx = null; loadAndDraw(a); });
  const cv = $('chart');
  cv.onpointermove = e => { const r = cv.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * cv.width; hoverIdx = px; drawChart(a); };
  cv.onpointerleave = () => { hoverIdx = null; drawChart(a); };
  loadAndDraw(a);
}
async function loadAndDraw(a){
  const day = S.day || todayIST();
  try{
    if(S.tf === '1D'){
      if(dailyCache.sym !== a.symbol){ const r = await api(`/api/candles/${a.symbol}?tf=1d&days=250`); dailyCache.sym = a.symbol; dailyCache.bars = r.bars; }
    }else{
      const key = a.symbol + '|' + day;
      if(chartCache.key !== key || S.following){ const r = await api(`/api/candles/${a.symbol}?day=${day}`); chartCache.key = key; chartCache.data = r.candles; chartCache.ref = r.ref || {}; chartCache.delta = r.delta_available; }
    }
  }catch(e){ return; }
  if(S.selected === a.symbol) drawChart(a);
}
function drawChart(a){
  const cv = $('chart'); if(!cv) return; const ctx = cv.getContext('2d');
  const C = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const W=cv.width, H=cv.height, pL=8, pR=70, pT=10, pB=18, gap=6, Hv=64, Ho=64, Hp=H-pT-pB-Hv-Ho-2*gap;
  const yv0 = pT+Hp+gap, yo0 = yv0+Hv+gap;
  ctx.clearRect(0,0,W,H); ctx.font='10px JetBrains Mono, monospace'; ctx.lineWidth=1;
  const readout = $('readout');
  const daily = S.tf === '1D';
  const bars = daily ? (dailyCache.bars||[]) : (chartCache.data ? resampleBrowser(cutAt(chartCache.data, S.at||'15:30'), TFMIN[S.tf]) : []);
  if(!bars.length){ ctx.fillStyle=C('--muted'); ctx.fillText(daily?'no daily bars':'no data for '+a.symbol+' on '+(S.day||todayIST()), pL+4, pT+14); if(readout) readout.textContent=''; return; }
  const n = daily ? bars.length : 375;
  const xi = i => pL + i/n*(W-pL-pR);
  const tfm = daily ? 1 : TFMIN[S.tf];
  const bw = Math.max(1, (W-pL-pR)/n*tfm*0.7);
  const bx = b => daily ? xi(b.k) : xi(b.i0);
  if(daily) bars.forEach((b,k)=>b.k=k);
  // ---- price scale
  const mins = chartCache.data && !daily ? cutAt(chartCache.data, S.at||'15:30') : [];
  const lv = daily ? [] : [a.R2,a.R1,a.S1,a.S2];
  let lo = Math.min(...bars.map(b=>b.l), ...lv), hi = Math.max(...bars.map(b=>b.h), ...lv); const pd=(hi-lo)*.05||1; lo-=pd; hi+=pd;
  const y = p => pT + (1-(p-lo)/(hi-lo))*Hp;
  // ---- overlays (intraday only, from 1-minute data)
  if(!daily){
    if(a.ob){ ctx.fillStyle=a.ob.dir>0?C('--bull-soft'):C('--bear-soft'); ctx.fillRect(pL,y(a.ob.hi),W-pL-pR,y(a.ob.lo)-y(a.ob.hi)); }
    ctx.fillStyle=C('--line'); ctx.globalAlpha=.45; ctx.fillRect(xi(0),y(a.orH),xi(15)-xi(0),y(a.orL)-y(a.orH)); ctx.globalAlpha=1;
    const ref = chartCache.ref||{};
    const levels = [['R2',a.R2,'--bull'],['R1',a.R1,'--bull'],['S1',a.S1,'--amber'],['S2',a.S2,'--amber'],['PC',a.price-a.chg,'--muted']];
    if(ref.prev_high) levels.push(['PDH',+ref.prev_high,'--muted'],['PDL',+ref.prev_low,'--muted']);
    levels.forEach(([nm,p,c])=>{ if(p<lo||p>hi) return; ctx.strokeStyle=C(c); ctx.setLineDash(nm.startsWith('PD')?[1,3]:[3,3]); ctx.beginPath(); ctx.moveTo(pL,y(p)); ctx.lineTo(W-pR,y(p)); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=C(c); ctx.fillText(`${nm} ${fmt(p)}`,W-pR+4,y(p)+3); });
    ctx.strokeStyle=C('--vwap'); ctx.lineWidth=1.2; ctx.setLineDash([2,2]); ctx.beginPath();
    vwapSeries(mins).forEach((p,k)=>{ const yy=y(p.v); k?ctx.lineTo(xi(p.i),yy):ctx.moveTo(xi(p.i),yy); }); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
  }
  // ---- candles + volume
  const vmax = Math.max(...bars.map(b=>b.v||0), 1);
  bars.forEach(b=>{ const up=b.c>=b.o, col = up?C('--bull'):C('--bear'); const x0 = bx(b);
    ctx.strokeStyle=ctx.fillStyle=col; if(b.stub){ ctx.globalAlpha=.5; }
    ctx.beginPath(); ctx.moveTo(x0+bw/2,y(b.h)); ctx.lineTo(x0+bw/2,y(b.l)); ctx.stroke();
    ctx.fillRect(x0,y(Math.max(b.o,b.c)),bw,Math.max(1,Math.abs(y(b.o)-y(b.c))));
    ctx.globalAlpha=.7; ctx.fillRect(x0, yv0+Hv-(b.v||0)/vmax*Hv, bw, (b.v||0)/vmax*Hv); ctx.globalAlpha=1; });
  // ---- OI pane
  const ois = bars.map(b=>b.oi).filter(v=>v);
  if(ois.length){
    const olo=Math.min(...ois), ohi=Math.max(...ois), opd=(ohi-olo)*.1||1; const yo = v => yo0 + (1-(v-(olo-opd))/((ohi+opd)-(olo-opd)))*Ho;
    const base = ois[0]; ctx.strokeStyle=C('--line'); ctx.setLineDash([2,2]); ctx.beginPath(); ctx.moveTo(pL,yo(base)); ctx.lineTo(W-pR,yo(base)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=C('--accent'); ctx.lineWidth=1.4; ctx.beginPath(); let started=false;
    bars.forEach(b=>{ if(!b.oi) return; const xx=bx(b)+bw/2, yy=yo(b.oi); started?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); started=true; }); ctx.stroke(); ctx.lineWidth=1;
    const last = ois[ois.length-1], chg=(last/base-1)*100; ctx.fillStyle=chg>=0?C('--bull'):C('--bear'); ctx.fillText(`OI ${sg(chg,1)}%`, W-pR+4, yo(last)+3);
  }
  ctx.fillStyle=C('--muted'); ctx.fillText('VOL', pL+2, yv0+9); ctx.fillText('OI', pL+2, yo0+9);
  // ---- markers: alerts for this symbol up to the as-of minute
  if(!daily && S.alerts){
    const at = S.at||'15:30';
    S.alerts.filter(al => al.symbol===a.symbol && al.ts.slice(11,16) <= at).forEach(al => {
      const i = hhmmToMin(al.ts.slice(11,16)); const m = (chartCache.data||[]).find(c=>minIdx(c)===i); if(!m) return;
      const xx = xi(i)+ (W-pL-pR)/375*0.5; const longish = al.side==='long';
      ctx.fillStyle = longish ? C('--bull') : C('--bear'); ctx.beginPath();
      if(longish){ const yy=y(m.l)+4; ctx.moveTo(xx,yy); ctx.lineTo(xx-4,yy+7); ctx.lineTo(xx+4,yy+7); }
      else { const yy=y(m.h)-4; ctx.moveTo(xx,yy); ctx.lineTo(xx-4,yy-7); ctx.lineTo(xx+4,yy-7); }
      ctx.closePath(); ctx.fill();
    });
  }
  // ---- last price tag, as-of marker, axis
  const lastB = bars[bars.length-1]; ctx.fillStyle=C('--fg'); ctx.fillRect(W-pR,y(lastB.c)-7,66,14); ctx.fillStyle=C('--bg'); ctx.fillText(fmt(lastB.c),W-pR+4,y(lastB.c)+3);
  if(!daily && S.at){ const xa = xi(hhmmToMin(S.at)); ctx.strokeStyle=C('--muted'); ctx.setLineDash([1,2]); ctx.beginPath(); ctx.moveTo(xa,pT); ctx.lineTo(xa,yo0+Ho); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle=C('--muted');
  if(daily){ const step=Math.max(1,Math.round(bars.length/6)); bars.forEach((b,k)=>{ if(k%step===0) ctx.fillText(b.day.slice(5), xi(k)-14, H-5); });
    const sel = S.day || todayIST(); const si = bars.findIndex(b=>b.day===sel); if(si>=0){ ctx.strokeStyle=C('--accent'); ctx.beginPath(); ctx.moveTo(xi(si)+bw/2,pT); ctx.lineTo(xi(si)+bw/2,yo0+Ho); ctx.stroke(); }
  } else [['09:15',0],['10:00',45],['11:00',105],['12:00',165],['13:00',225],['14:00',285],['15:00',345]].forEach(([l,i])=>ctx.fillText(l,xi(i)-12,H-5));
  // ---- crosshair + readout
  if(hoverIdx != null){
    let b, label;
    if(daily){ const k = Math.max(0, Math.min(bars.length-1, Math.round((hoverIdx-pL)/(W-pL-pR)*n))); b = bars[k]; label = b.day; }
    else { const i = Math.max(0, Math.min(374, Math.round((hoverIdx-pL)/(W-pL-pR)*n))); b = [...bars].reverse().find(x=>x.i0<=i); label = minToHHMM(b?b.i0:i); }
    if(b){
      const xx = daily ? xi(b.k)+bw/2 : xi(b.i0)+bw/2; ctx.strokeStyle=C('--fg'); ctx.globalAlpha=.35; ctx.beginPath(); ctx.moveTo(xx,pT); ctx.lineTo(xx,yo0+Ho); ctx.stroke(); ctx.globalAlpha=1;
      let extra = '';
      if(!daily){ const vw = vwapSeries(mins).filter(p=>p.i<=b.i0+tfm-1).pop(); if(vw) extra += `  VWAP ${fmt(vw.v)}`;
        const hit = (S.alerts||[]).find(al=>al.symbol===a.symbol && Math.floor(hhmmToMin(al.ts.slice(11,16))/tfm)===Math.floor(b.i0/tfm)); if(hit) extra += `  ▲ ${hit.scan}`; }
      if(readout) readout.textContent = `${label}  O ${fmt(b.o)}  H ${fmt(b.h)}  L ${fmt(b.l)}  C ${fmt(b.c)}  V ${b.stub&&!b.v?'—':K(b.v)}${extra}  OI ${K(b.oi)}`;
    }
  } else if(readout) readout.textContent = daily ? `${bars.length} daily bars` : (chartCache.delta===false ? 'backfilled day · no tick delta' : '');
}

function renderAll(){
  if(!S.snap) return;
  $('clock').textContent = S.at || S.snap.ts.slice(11,16);
  renderCards();
  if(!S.selected && S.snap.bulls[0]) S.selected = S.snap.bulls[0].symbol;
  renderDetail();
}
async function loadAlerts(){
  const day = S.day;
  try{ const res = await api(day ? `/api/alerts?day=${day}` : '/api/alerts?limit=20');
    if(day !== S.day) return;
    const al = Array.isArray(res) ? res : res.alerts;
    S.alerts = al; S.alertsPending = !!(res && res.pending);
    $('alerts').innerHTML = (S.alertsPending ? '<div class="mut" style="padding:4px 0">computing replay alerts for this day…</div>' : '') +
      (al.map(a=>`<div class="alert"><span class="mono">${a.ts.slice(11,16)}</span><span>${a.scan}</span><b class="mono">${a.symbol}</b></div>`).join('') || (S.alertsPending ? '' : '<span class="mut">none yet</span>'));
    if(S.alertsPending){ clearTimeout(S.alertsTimer); S.alertsTimer = setTimeout(loadAlerts, 10000); }
  }catch(e){}
}
function showEmpty(html){
  S.snap = null; ['bulls','bears','sectors'].forEach(id => $(id).innerHTML = ''); $('nbull').textContent = $('nbear').textContent = '0';
  $('detail').innerHTML = `<p class="eyebrow">Select a stock</p><div class="empty">${html}</div>`;
}

// ---------- time / day controls ----------
const MIN0 = 9*60+15;
const minToHHMM = m => { const t = MIN0 + Math.max(0, Math.min(375, m)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const hhmmToMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m-MIN0; };
const todayIST = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kolkata'});
$('ticks').innerHTML = ['10:00','11:00','12:00','13:00','14:00','15:00'].map(t=>`<span style="left:${hhmmToMin(t)/375*100}%">${t}</span>`).join('');
S.following = true; S.liveSnap = null;
let inflight = null, pending = null;

function setAt(hhmm){ S.at = hhmm; $('clock').textContent = hhmm; $('at').value = hhmmToMin(hhmm); }
async function fetchReplay(){
  const want = {day:S.day, at:S.at};
  if(inflight){ pending = want; return; }
  inflight = want;
  try{
    const snap = await api(`/api/replay?day=${want.day}&at=${want.at}`);
    if(want.day===S.day && want.at===S.at && !S.following){
      // equities stop printing before 15:30; park the slider on the last real bar when the user asked for "end of day"
      if(snap.last_bar && snap.last_bar < want.at && S.atAuto) setAt(snap.last_bar);
      S.snap = snap; S.mode='replay'; setStatus('REPLAY','replay'); renderAll();
    }
  }catch(e){
    if(want.day===S.day && want.at===S.at && !S.following) showEmpty(`no data for ${want.day} at ${want.at}`);
  }finally{
    inflight = null;
    if(pending){ const p = pending; pending = null; if(p.day!==want.day || p.at!==want.at) fetchReplay(); }
  }
}
function enterReplay(day, at, auto=false){
  const dayChanged = day !== S.day;
  S.following = false; S.day = day; S.atAuto = auto; setAt(at); $('live').hidden = !(S.live || S.liveSnap); $('day').value = day; setStatus('REPLAY','replay');
  fetchReplay(); if(dayChanged) loadAlerts();
}
function goLive(){
  S.following = true; S.day = null; S.mode = 'live'; $('live').hidden = true; $('day').value = todayIST();
  if(S.liveSnap){ S.snap = S.liveSnap; setAt(S.snap.ts.slice(11,16)); setStatus('LIVE','live'); renderAll(); }
  else { setStatus('WAITING',''); showEmpty('Waiting for the first ranking. Cards appear from 09:15 on a trading day.'); }
  loadAlerts();
}
function populateDays(){
  const today = todayIST();
  const opts = (S.live && !S.days.includes(today)) ? [today, ...S.days] : S.days;
  $('day').innerHTML = opts.map(d => `<option value="${d}">${d}${d===today?' · today':''}</option>`).join('');
  $('day').hidden = opts.length === 0;
}
$('day').onchange = () => { const v = $('day').value; (v === todayIST() && S.live) ? goLive() : enterReplay(v, '15:30', true); };
$('at').oninput = () => enterReplay(S.day || todayIST(), minToHHMM(+$('at').value));
$('live').onclick = goLive;
document.addEventListener('keydown', e => {
  if(e.target.closest('input,select,textarea') || (e.key!=='ArrowLeft' && e.key!=='ArrowRight')) return;
  e.preventDefault();
  const step = (e.shiftKey ? 5 : 1) * (e.key==='ArrowLeft' ? -1 : 1);
  enterReplay(S.day || todayIST(), minToHHMM(hhmmToMin(S.at || '15:30') + step));
});

// ---------- live feed ----------
function onLiveSnapshot(snap){
  S.liveSnap = snap; S.live = true;
  if(S.following){ S.snap = snap; S.mode='live'; setAt(snap.ts.slice(11,16)); setStatus('LIVE','live'); renderAll(); loadAlerts(); }
}
function connect(){
  const ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/scan');
  ws.onmessage = e => onLiveSnapshot(JSON.parse(e.data));
  ws.onclose = () => { if(S.following && S.liveSnap) setStatus('RECONNECTING','warn'); setTimeout(connect, 3000); };
}
document.addEventListener('click', e => { const c = e.target.closest('.card'); if(c){ S.selected = c.dataset.sym; renderCards(); renderDetail(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderDetail);

(async () => {
  try{ const ins = await api('/api/instruments'); ins.forEach(i => { S.lots[i.symbol] = i.lot_size; S.sectorsOf[i.symbol] = i.sector; }); }catch(e){}
  try{ const d = await api('/api/days'); S.days = d.days; S.live = d.live; S.expiry = d.expiry; }catch(e){ S.days = []; }
  populateDays();
  connect();
  let liveSnap = null;
  try{ liveSnap = await api('/api/scan'); }catch(e){}
  if(liveSnap){ onLiveSnapshot(liveSnap); }
  else if(S.live){ setStatus('WAITING',''); $('day').value = todayIST(); loadAlerts(); }
  else if(S.days.length){ enterReplay(S.days[0], '15:30', true); }
  else { showEmpty('No sessions stored yet. On the VPS run <code>docker compose run --rm ingest python backfill.py</code> to load the last 60 days, then reload.'); }
})();
</script></body></html>
